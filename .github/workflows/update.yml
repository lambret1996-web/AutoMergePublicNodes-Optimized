name: 更新节点列表

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    paths:
      - 'core/**'
      - 'main.py'
      - 'config/**'
      - 'requirements.txt'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/update.yml'
  workflow_dispatch:
    inputs:
      top_n:
        description: 'verified.* 输出节点数量(默认 300)'
        required: false
        default: '300'
      test_limit:
        description: '送入真实测速的最大节点数量(默认 3000)'
        required: false
        default: '3000'
      min_retain_ratio:
        description: '节点保留缩水比例，0=关闭缩水并强制写入本轮测速结果(默认 0)'
        required: false
        default: '0'
      audit:
        description: '同时执行订阅源审计检测'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: update-nodes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.12 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装项目依赖包
        run: pip install -r requirements.txt

      - name: 获取 sing-box 最新版本号
        id: sb-version
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.tag_name')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::获取 sing-box 版本号失败"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sing-box 最新版本: $VERSION"

      - name: 缓存 sing-box 二进制程序
        id: cache-sb
        uses: actions/cache@v4
        with:
          path: ./sing-box
          key: sing-box-${{ runner.os }}-${{ steps.sb-version.outputs.version }}

      - name: 下载 sing-box 程序
        if: steps.cache-sb.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.sb-version.outputs.version }}"
          VER_NUM="${VERSION#v}"
          # 优先下载最新版，失败则回退使用旧版本
          if curl -fsSL -L -o sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/${VERSION}/sing-box-${VER_NUM}-linux-amd64.tar.gz"; then
            tar -xzf sb.tar.gz
            mv "sing-box-${VER_NUM}-linux-amd64/sing-box" ./sing-box
            chmod +x ./sing-box
          else
            echo "::warning::sing‑box 最新版下载失败，尝试回退版本"
            for FALLBACK_VER in "v1.11.15" "v1.10.7" "v1.9.7"; do
              FV="${FALLBACK_VER#v}"
              if curl -fsSL -L -o sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/${FALLBACK_VER}/sing-box-${FV}-linux-amd64.tar.gz"; then
                tar -xzf sb.tar.gz
                mv "sing-box-${FV}-linux-amd64/sing-box" ./sing-box
                chmod +x ./sing-box
                echo "使用回退版本 sing-box ${FALLBACK_VER}"
                break
              fi
            done
            if [ ! -f ./sing-box ]; then
              echo "::error::所有 sing‑box 下载尝试全部失败"
              exit 1
            fi
          fi

      - name: 订阅源审计检测
        run: |
          python tools/audit_sources.py --sources config/sources.yaml --output output/source_audit.json

      - name: Python语法编译校验
        run: python -m compileall -q main.py core tools tests

      - name: 导入合约规则
        run: python tools/import_contract.py

      - name: 配置文件合法性校验
        run: python tools/validate_config.py --sources config/sources.yaml --filter-rules config/filter_rules.yaml --scoring-rules 'config/scoring*.yaml'

      - name: 执行单元回归测试
        run: python -m unittest -v tests.test_regressions

      - name: 运行节点更新处理流水线
        env:
          AUTONODES_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          TOP_N="${{ github.event.inputs.top_n || '300' }}"
          TEST_LIMIT="${{ github.event.inputs.test_limit || '3000' }}"
          MIN_RETAIN_RATIO="${{ github.event.inputs.min_retain_ratio || '0' }}"
          [[ "$TOP_N" =~ ^[0-9]+$ ]] || { echo "::error::top_n 必须为非负整数"; exit 1; }
          [[ "$TEST_LIMIT" =~ ^[0-9]+$ ]] || { echo "::error::test_limit 必须为非负整数"; exit 1; }
          [[ "$MIN_RETAIN_RATIO" =~ ^[0-9]+([.][0-9]+)?$ ]] || { echo "::error::min_retain_ratio 必须为非负数字"; exit 1; }
          [ "$TOP_N" -le 1000 ] || { echo "::error::top_n 不能大于 1000"; exit 1; }
          [ "$TEST_LIMIT" -le 5000 ] || { echo "::error::test_limit 不能大于 5000"; exit 1; }
          python main.py \
            --top-n "$TOP_N" \
            --test-limit "$TEST_LIMIT" \
            --min-retain-ratio "$MIN_RETAIN_RATIO" \
            --repo "${{ github.repository }}" \
            --branch "${{ github.event.repository.default_branch }}"

      - name: 生成健康状态报告
        run: |
          python tools/source_scores_report.py --output-dir output --output output/source_scores.md
          python tools/scoring_profiles_report.py --profiles 'config/scoring*.yaml' --output output/scoring_profiles.md
          python tools/suggest_source_cleanup.py --output-dir output --sources config/sources.yaml --output output/source_cleanup_suggestions.md --json-output output/source_cleanup_suggestions.json
          python tools/health_report.py --output-dir output --verified-prefix verified --output output/health_report.json
          python tools/daily_report.py --output-dir output --output output/daily_report.md

      - name: 外部订阅源发现扫描
        if: always()
        continue-on-error: true
        run: |
          python tools/source_discovery.py --sources config/sources.yaml --output output/source_discovery.json --timeout 15 || true

      - name: 生成工作流运行摘要
        if: always()
        run: |
          if [ -f output/stats.json ]; then
            python tools/actions_summary.py \
              --stats output/stats.json \
              --repo "${{ github.repository }}" \
              --branch "${{ github.event.repository.default_branch }}"
          else
            echo "# 节点自动更新运行摘要" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "未生成 stats.json 文件，请检查前面步骤日志。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 提交并推送更新结果
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          BRANCH="${{ github.event.repository.default_branch }}"
          # 主动拉取远端最新分支，避免浅克隆导致引用过期
          git fetch --unshallow origin "$BRANCH" 2>/dev/null || git fetch origin "$BRANCH"
          git rm -f output/top.* 2>/dev/null || true
          git add output/ README.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "没有检测到内容变更，跳过提交"
          else
            git commit -m "chore: 更新节点列表 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M CST')"
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash --strategy-option=theirs origin "$BRANCH"; then
                git push origin HEAD:"$BRANCH" && break
              else
                git rebase --abort 2>/dev/null || true
                echo "::error::变基合并失败，禁止自动强制推送"
                exit 1
              fi
              if [ "$i" = "5" ]; then
                echo "::error::git推送经过5次重试仍然失败"
                exit 1
              fi
              sleep 5
            done
          fi

      - name: 上传调试产物包
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 节点更新调试输出
          path: |
            output/stats.json
            output/source_audit.json
            output/health_report.json
            output/health_report.md
            output/daily_report.md
            output/source_scores.md
            output/scoring_profiles.md
            output/source_cleanup_suggestions.md
            output/source_cleanup_suggestions.json
            output/source_discovery.json
            output/node_stability.json
            output/trend_history.json
            output/*.converter.md

      - name: 工作流失败创建Issue告警
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 CI执行失败: ${{ github.run_id }}`,
              body: `节点更新工作流运行失败。\n\n[查看运行日志](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n触发方式: ${{ github.event_name }}\n分支: ${{ github.ref_name }}`,
              labels: ['ci-failure']
            })
            .catch(err => core.warning(`创建失败告警Issue异常: ${err.message}`))

      - name: 工作流成功自动关闭失败告警Issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure'
            });
            for (const issue of issues.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                labels: [...issue.labels.map(l => l.name), '已恢复正常']
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ CI已经恢复正常，该告警已自动关闭。\n\n[本次成功运行记录](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`
              });
            }
            core.info(`已关闭 ${issues.data.length} 条CI失败告警工单`);

      - name: 清除 jsDelivr CDN缓存
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          BRANCH="${{ github.event.repository.default_branch }}"
          failed=0
          for f in verified.txt verified.yaml verified.json verified.urls verified.converter.md global.txt global.yaml global.json global.urls global.converter.md all.txt all.yaml all.json all.urls all.converter.md stats.json source_audit.json health_report.json health_report.md daily_report.md source_scores.md scoring_profiles.md source_cleanup_suggestions.md source_cleanup_suggestions.json source_discovery.json node_stability.json trend_history.json geo_cache.json; do
            code=$(curl -s -o /tmp/jsdelivr-purge.json -w '%{http_code}' "https://purge.jsdelivr.net/gh/${REPO}@${BRANCH}/output/${f}" || true)
            if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
              echo "::warning::清除CDN缓存失败 output/${f} HTTP状态码 ${code}"
              failed=$((failed + 1))
            else
              echo "已清除缓存 output/${f} HTTP ${code}"
            fi
          done
          # 清除分片文件、按协议分类文件缓存
          for f in chunks/verified_1.txt chunks/verified_2.txt chunks/verified_3.txt chunks/global_1.txt chunks/global_2.txt chunks/global_3.txt by_protocol/verified_vmess.txt by_protocol/verified_vless.txt by_protocol/verified_trojan.txt by_protocol/verified_shadowsocks.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://purge.jsdelivr.net/gh/${REPO}@${BRANCH}/output/${f}" || true) && echo "已清除缓存 output/${f} HTTP ${code}" || true
          done
          echo "jsDelivr缓存清除警告次数: ${failed}"
